repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      # Última red contra subir un .env con tokens reales.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/
        # Cada una está aquí porque sin ella mypy ve `Any` donde el código real
        # tiene un tipo, y un `Any` silencioso es peor que un error: convierte
        # el hook en un sello de goma justo en los módulos que más lo necesitan.
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - sqlalchemy[asyncio]>=2.0
          - structlog>=24.0
          - fastapi>=0.110
          - httpx>=0.27
          - types-PyYAML
