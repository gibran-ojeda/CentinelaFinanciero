# Despliegue a producción.
#
# Se dispara en push a `main` y a mano (`workflow_dispatch`), que es también la
# vía del rollback: se lanza con el SHA anterior en `ref`.
#
# El workflow no contiene la lógica: la manda por stdin desde `scripts/`. Así
# los scripts se leen, se prueban y se corrigen sin tocar YAML, y los secretos
# viajan por stdin en vez de ir en la línea de comandos del proceso remoto,
# donde un `ps` los enseñaría.
#
# Detalle operativo, rollback y respaldos: docs/despliegue.md

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit o rama a desplegar (para rollback, el SHA anterior)"
        required: false
        default: ""

# Un despliegue a la vez, y sin cancelar el que esté corriendo: interrumpir a
# medio `alembic upgrade` deja la base en un estado que nadie eligió.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: desplegar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Resolver la referencia a desplegar
        id: ref
        run: |
          REF="${{ github.event.inputs.ref }}"
          echo "valor=${REF:-${{ github.sha }}}" >> "$GITHUB_OUTPUT"

      - name: Preparar la llave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          # El host key se fija por secreto en vez de aceptarlo a ciegas: un
          # StrictHostKeyChecking=no convierte cualquier secuestro de DNS en
          # una sesión con nuestras credenciales dentro.
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

          # Comprobar aquí que la llave se puede leer, y no tres pasos después.
          # `ssh-keygen -y` deriva la pública desde la privada: si el archivo
          # está mutilado —CRLF de un pegado desde Windows, una línea perdida
          # al seleccionar con el ratón— no puede, y falla con un mensaje que
          # se entiende. Sin esto, el síntoma es un `error in libcrypto` de
          # OpenSSL seguido de intentos de contraseña, que no se parece en nada
          # a su causa.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY no es una clave privada válida. Suele ser CRLF o un pegado truncado. Vuelve a fijarla leyendo el archivo, sin portapapeles: gh secret set VPS_SSH_KEY < ~/.ssh/centinela_deploy"
            exit 1
          fi

      - name: Desplegar
        run: |
          # Las dos opciones del `ssh` de abajo, que aquí no son manía:
          #
          #   BatchMode=yes      prohíbe cualquier prompt. Sin él, una llave que
          #     no carga hace que ssh degrade a contraseña — y ssh lee la
          #     contraseña de **stdin**, que es esta misma tubería. El resultado
          #     fue mandar las primeras líneas del script como intentos de
          #     autenticación hasta agotar MaxAuthTries, y un fallo de 16
          #     segundos que no se parecía a su causa.
          #   IdentitiesOnly=yes obliga a usar esta llave y no otra que el
          #     agente ofrezca. Sin él, un día podría entrar con una credencial
          #     distinta y el secreto seguiría mal sin que nadie lo supiera.
          {
            echo "REF='${{ steps.ref.outputs.valor }}'"
            echo "POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'"
            echo "API_READ_KEY='${{ secrets.API_READ_KEY }}'"
            echo "API_ADMIN_KEY='${{ secrets.API_ADMIN_KEY }}'"
            echo "SITE_URL='${{ secrets.SITE_URL }}'"
            # Opcionales: si el secreto no existe llegan vacías y el
            # despliegue sigue. Lo que no funciona sin ellas son los jobs de
            # ingesta de las fases 7 y 9, no el sitio.
            echo "BANXICO_TOKEN='${{ secrets.BANXICO_TOKEN }}'"
            echo "DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}'"
            # Variable de repo, no secreto: es el gate frío del researcher L3.
            # Sin definirla llega vacía y desplegar.sh la deja en false.
            echo "SCHEDULER_RESEARCH_ENABLED='${{ vars.SCHEDULER_RESEARCH_ENABLED }}'"
            cat scripts/desplegar.sh
          } | ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes -o BatchMode=yes \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s'

      - name: Gates
        run: |
          # `gates.sh` sale del repo ya actualizado en el VPS, no de este
          # checkout: se comprueba el commit que se acaba de desplegar con las
          # comprobaciones de ese mismo commit.
          #
          # `export` y no una asignación a secas, que es lo que había: aquí el
          # script NO se concatena a este mismo shell —como sí hace el paso de
          # arriba con `cat scripts/desplegar.sh`— sino que `exec bash` arranca
          # un proceso nuevo, y una variable de shell sin exportar no lo cruza.
          # El gate abortaba por «falta API_READ_KEY» sin llegar a comprobar
          # nada, que es la peor forma de fallar: parece un secreto mal puesto.
          {
            echo "export API_READ_KEY='${{ secrets.API_READ_KEY }}'"
            echo 'cd ~/centinela-financiero && exec bash scripts/gates.sh'
          } | ssh -i ~/.ssh/id_deploy \
                -o IdentitiesOnly=yes -o BatchMode=yes \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s'

      - name: Qué hacer si algo de esto falló
        if: failure()
        run: |
          cat <<'AYUDA'
          El despliegue se detuvo. El VPS quedó en el estado del último paso que pasó.

          Rollback: Actions → deploy → Run workflow, y en `ref` el SHA anterior.
          Si el problema fue la migración, antes hay que bajarla a mano:

            ssh <vps> 'cd ~/centinela-financiero && \
              docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T api alembic downgrade -1'

          Detalle en docs/despliegue.md.
          AYUDA

      - name: Borrar la llave
        if: always()
        run: rm -f ~/.ssh/id_deploy
