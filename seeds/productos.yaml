# Productos de captación del catálogo MVP.
#
# El `instrumento` determina el tratamiento fiscal (§4.2) y es independiente de
# la categoría de la institución: un banco puede ofrecer PRLV y también fondos
# de deuda, que tributan distinto.
#
# Regla del esquema: VISTA nunca lleva `plazo_dias`; PLAZO siempre lo lleva.
# Clave natural para el upsert idempotente: institución + nombre + plazo.

productos:
