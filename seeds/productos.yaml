  # ── Hey Banco, medido en banco.hey.inc el 2026-08-07 ───────────────────────
  #
  # Publica pagarés a 7 y 28 días desde $1,000, y nada a la vista. Como Cliente
  # Hey se paga **4.00 %** a los dos plazos; el 7.00 % a 7 días y el 7.50 % a
  # 28 es «tasa exclusiva al ser Fan Hey o Hey Pro, por tiempo limitado», así
  # que va a `condiciones` por la regla 5 y no se siembra como producto.
  #
  # «Inversión Hey Negocios» (7 y 28 días) queda **fuera a propósito**: es
  # banca de empresas, y la cobertura del IPAB, el ISR y la ganancia real que
  # calculamos son los de una persona física.
  #
  # Pero dejarlo fuera no basta: Hey lo publica en la misma página y en el
  # mismo plazo, así que su casilla `(PLAZO, 7)` y `(PLAZO, 28)` aloja varios
  # productos publicados y el pipeline no puede decidir cuál es el nuestro.
  # Por eso llevan `nombre_publicado`.
  #
  # El nombre es «Cliente Hey» y no «Inversión Hey», medido en la corrida del
  # 2026-08-08: el modelo devuelve seis productos con nombre propio —«Cliente
  # Hey 7 días», «Hey Pro / Fan Hey 7 días», «Inversión Hey Negocios 7 días» y
  # los tres a 28— desde que la regla 4 le pide nombrar distinto lo que es
  # distinto. Con «Inversión Hey» no encajaba ninguno y las seis salían como
  # hueco; peor aún, ese nombre encabeza «Inversión Hey Negocios» y se habría
  # quedado justo con el producto que queremos fuera.
  #
  # «Cliente Hey» encabeza sólo la tasa que obtiene cualquiera —el 4.00 % a los
  # dos plazos— y no encabeza ni la de Fan/Pro ni la de Negocios, que siguen
  # saliendo como hueco a propósito. El plazo no va en el nombre: lo distingue
  # la casilla, y repetirlo aquí ataría la lectura a que el modelo escriba
  # «7 días» con acento.
  - institucion: Hey Banco
    nombre: Hey Inversión 7 días
    slug: hey-plazo-7
    nombre_publicado: Cliente Hey
    tipo: PLAZO
    instrumento: DEPOSITO_BANCARIO
    plazo_dias: 7
    monto_minimo: 1000.00
    liquidez: AL_VENCIMIENTO

  - institucion: Hey Banco
    nombre: Hey Inversión 28 días
    slug: hey-plazo-28
    nombre_publicado: Cliente Hey
    tipo: PLAZO
    instrumento: DEPOSITO_BANCARIO
    plazo_dias: 28
    monto_minimo: 1000.00
    liquidez: AL_VENCIMIENTO

  # Apagado el 2026-08-07: Hey no publica ningún producto a la vista. Su 7.00 %
  # sembrado es la tasa de Fan Hey / Hey Pro **a 7 días**, que el agregador
  # colocó en una cuenta a la vista.
  - institucion: Hey Banco
    nombre: Hey Inversión a la vista
