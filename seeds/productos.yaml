  - institucion: Gobierno Federal
    nombre: CETES 28 días
    slug: cetes-28
    tipo: PLAZO
    instrumento: CETES
    plazo_dias: 28
    monto_minimo: 100.00
    liquidez: AL_VENCIMIENTO
    penalizacion_retiro: >-
      Se pueden vender antes del vencimiento en el mercado secundario, a precio
      de mercado: el rendimiento puede diferir del contratado.

