  # ── Klar, medido en klar.mx/inversion el 2026-08-07 ────────────────────────
  #
  # Publica una tabla de dos filas —membresía × siete productos— con esta nota
  # al pie: «Tasa Fija aplicable a una inversión mínima de $100 pesos».
  #
  #                        Klar    Klar Plus y Platino
  #   Cuenta                3 %          5 %
  #   Inversión Flexible    6 %          8 %
  #   Inversión Fija   7 d  6.10 %       8.10 %
  #   Inversión Fija  30 d  6.20 %       8.20 %
  #   Inversión Fija  90 d  6.30 %       8.30 %
  #   Inversión Fija 180 d  6.40 %       8.40 %
  #   Inversión Fija 365 d  6.50 %       8.50 %
  #
  # La fila de Plus y Platino no se siembra: es una tasa por membresía, y la
  # regla 5 del extractor manda publicar la que obtiene cualquiera y describir
  # el resto en `condiciones`.
