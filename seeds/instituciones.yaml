# Catálogo de instituciones del MVP (decisión D3): top 10 SOFIPOs, top 5
# neobancos con licencia bancaria, el emisor gubernamental y un IFPE.
#
# La `categoria` es la **figura regulatoria vigente**, no la percepción de
# mercado (§3 del foundation). De ella se deriva la cobertura de seguro, así
# que equivocarla equivale a mentirle al usuario sobre cuánto tiene protegido.
#
# `nombre_cnbv` queda vacío a propósito: es la clave de mapeo contra los
# boletines de la CNBV y se rellena en la fase 8 leyendo el fichero real. No se
# inventa.
#
# Clave natural para el upsert idempotente: `nombre`.

instituciones:
  # ─── Gubernamental ──────────────────────────────────────────
  - nombre: Gobierno Federal
    slug: gobierno-federal
    categoria: GOBIERNO
    tipo_seguro: SOBERANO
    url_sitio: https://www.cetesdirecto.com/
    estatus_regulatorio: Deuda soberana emitida por la SHCP y colocada por Banxico
    notas: >-
      Sin límite de cobertura: no hay fondo de protección porque el obligado es
      el propio Gobierno Federal (§4.6). Incluye CETES y BONDDIA, este último
      operado por Nacional Financiera.

  # ─── SOFIPOs (PROSOFIPO, 25,000 UDIs) ───────────────────────
  - nombre: DiDi
    slug: didi
    categoria: SOFIPO
    tipo_seguro: PROSOFIPO
    url_sitio: https://www.didiglobal.com/mx/finance
    estatus_regulatorio: Sociedad Financiera Popular autorizada por la CNBV

