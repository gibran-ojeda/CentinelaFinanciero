  # ─── Neobancos con licencia bancaria (IPAB, 400,000 UDIs) ───
  - nombre: Nu México
    slug: nu-mexico
    categoria: BANCO_DIGITAL
    tipo_seguro: IPAB
    url_sitio: https://nu.com.mx/
    estatus_regulatorio: Institución de Banca Múltiple autorizada por la CNBV
    notas: >-
      Fue SOFIPO hasta 2025. Obtuvo licencia bancaria en abril de 2025 y la
      CNBV autorizó el inicio de operaciones como banca múltiple en julio de
      2026, de modo que sus depósitos pasan de PROSOFIPO (25,000 UDIs) a IPAB
      (400,000 UDIs). Varios comparadores del mercado siguen clasificándola
      como SOFIPO y muestran una cobertura 16 veces menor de la real.

  - nombre: Revolut
    slug: revolut
    categoria: BANCO_DIGITAL
    tipo_seguro: IPAB
    url_sitio: https://www.revolut.com/es-MX/
    estatus_regulatorio: Institución de Banca Múltiple autorizada por la CNBV

