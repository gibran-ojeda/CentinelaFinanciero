# Catálogo de instituciones del MVP (decisión D3): top 10 SOFIPOs, top 5
# neobancos con licencia bancaria, el emisor gubernamental y un IFPE.
#
# La `categoria` es la **figura regulatoria vigente**, no la percepción de
# mercado (§3 del foundation). De ella se deriva la cobertura de seguro, así
# que equivocarla equivale a mentirle al usuario sobre cuánto tiene protegido.
#
# `nombre_cnbv` es la clave de mapeo contra los boletines de la CNBV. Se
# rellenó en la fase 8 **leyendo los ficheros reales** —`BE BM 202605.xlsx` y
# `BE_SOFIPOS_202603.xlsx`, descargados en julio de 2026— y no se inventa.
#
# Cuatro se quedan sin mapear porque no aparecen con ningún nombre reconocible
# y adivinar cuál es cuál sería peor que no cargarlas: DiDi, Supertasas y Te
# Creemos operan a través de una SOFIPO cuyo nombre regulatorio hay que
# confirmar, y Mercado Pago es un IFPE, figura que la CNBV no publica en el
# boletín de banca múltiple. El normalizador las reporta en cada corrida.
#
# Ojo con dos casos que el fichero real desmintió:
#
# - **Nu México aparece en el boletín de SOFIPOs**, no en el de banca múltiple,
#   aunque aquí esté como BANCO_DIGITAL. La ingesta lo lee de donde la CNBV lo
#   publica; la categoría de este catálogo decide la cobertura de seguro y ésa
#   se revisa aparte.
# - **La CNBV escribe el mismo banco de dos formas** en un mismo libro: la hoja
#   de cartera dice «Ualá» y «Openbank», la de capitalización «Banco Ualá» y
#   «Openbank México». Basta un `nombre_cnbv`: el normalizador compara por una
#   clave que quita «banco» y el sufijo de país.
#
# Clave natural para el upsert idempotente: `nombre`.

instituciones:
  # ─── Gubernamental ──────────────────────────────────────────
  - nombre: Gobierno Federal
    slug: gobierno-federal
    categoria: GOBIERNO
    tipo_seguro: SOBERANO
    url_sitio: https://www.cetesdirecto.com/
    estatus_regulatorio: Deuda soberana emitida por la SHCP y colocada por Banxico
    notas: >-
      Sin límite de cobertura: no hay fondo de protección porque el obligado es
      el propio Gobierno Federal (§4.6). Incluye CETES y BONDDIA, este último
      operado por Nacional Financiera.

