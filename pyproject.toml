[project]
name = "brujula-financiera"
version = "0.1.0"
description = "Comparador de herramientas financieras en México — tasas, GAT, ganancia real y salud institucional"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Gibran Ojeda", email = "gibran.ojeda.7@gmail.com" },
]
keywords = [
    "finanzas",
    "mexico",
    "cetes",
    "sofipo",
    "gat",
    "comparador",
]
# Núcleo compartido por todos los servicios: config, logging, persistencia,
# cache y migraciones. Lo específico de cada módulo vive en los extras.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
scheduler = [
    "apscheduler>=3.10,<4",
]
# Ingesta determinista (fases 7 y 8): boletines CNBV en CSV/XLSX.
ingest = [
    "pandas>=2.1",
    "openpyxl>=3.1",
]
# Extracción y research con LLM (fase 9). DeepSeek se consume vía API
# compatible con OpenAI, por eso basta el SDK de openai.
llm = [
    "openai>=1.0",
    "trafilatura>=1.6",
    "ddgs>=9.0",
]
# Sólo para las pocas páginas de tasas que renderizan por JavaScript (fase 9).
browser = [
    "playwright>=1.40",
]
mcp = [
    "mcp[cli]>=1.28,<2",
]
# Conjunto que instala la imagen Docker única: api + scheduler + cli.
app = [
    "brujula-financiera[api,scheduler]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.0",
    # Alembic abre la conexión él mismo y no usa el driver async del runtime.
    "psycopg2-binary>=2.9",
    "hypothesis>=6.100",
    "ruff",
    "black",
    "mypy",
]

[project.urls]
Repository = "https://github.com/gibran-ojeda/brujula-financiera"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas. black sí las formatea (no cambia semántica), pero
# no se reescriben a mano sólo para acortar líneas: el DDL de un CHECK con
# quince valores de enum no cabe en 99 columnas y partirlo invitaría a
# introducir errores en SQL ya verificado contra la base.
"alembic/versions/*.py" = ["E501", "W291"]

[tool.ruff.lint.isort]
# Sin esto, el directorio local `alembic/` hace que ruff clasifique el paquete
# `alembic` (que es una dependencia) como código propio.
known-third-party = ["alembic"]

[tool.black]
target-version = ["py312"]
line-length = 99

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "requires_docker: necesita un daemon de Docker (testcontainers); se salta si no lo hay",
]

[tool.coverage.run]
source = ["src"]
branch = true
