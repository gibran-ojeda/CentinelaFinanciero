[project]
name = "centinela-financiero"
version = "0.1.0"
description = "Comparador de herramientas financieras en México — tasas, GAT, ganancia real y salud institucional"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Gibran Ojeda", email = "gibran.ojeda.7@gmail.com" },
]
keywords = [
    "finanzas",
    "mexico",
    "cetes",
    "sofipo",
    "gat",
    "comparador",
]
# Núcleo compartido por todos los servicios: config, logging, persistencia,
# cache y migraciones. Lo específico de cada módulo vive en los extras.
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Explícito aunque httpx ya lo arrastre: `ingest_cnbv` construye su propio
    # contexto TLS sobre este almacén para añadirle el intermedio que la CNBV
    # omite, así que es una dependencia directa y no un accidente feliz.
    "certifi",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
scheduler = [
    "apscheduler>=3.10,<4",
]
# Ingesta determinista (fase 8): boletines de la CNBV en XLSX y PDF.
#
# **Sin pandas**, aunque el plan de la fase lo listara. El scheduler del VPS
# tiene 256 MB y el boletín de banca múltiple trae treinta y tres hojas;
# `openpyxl` en modo `read_only` recorre por filas sin materializar el libro,
# que es justo lo que un DataFrame haría. La fase 7 (Banxico) no necesita nada
# de aquí: es JSON sobre httpx, que ya está en el núcleo.
ingest = [
    "openpyxl>=3.1",
    # El NICAP de las SOFIPOs —la categoría prudencial N1–N4 de §5.1— sólo se
    # publica en PDF. Es la única fuente que hay.
    "pdfplumber>=0.11",
]
# Extracción con LLM (fase 9, nivel 2).
#
# Sin el SDK de `openai`: DeepSeek se consume con httpx directo, que ya es una
# dependencia base. Lo único que hace falta es un POST con JSON, y el SDK
# traería su propio pool, sus reintentos y su jerarquía de errores — tres cosas
# que habría que domar para que encajaran con las de `llm/`.
llm = [
    "trafilatura>=1.6",
]
# Búsqueda abierta (fase 9, nivel 3): la usa el job semanal del researcher
# (`tasas_research_abierta`), cuyo gate frío arranca apagado. El import es
# perezoso y la cadena de motores traga el ImportError como un fallo más de
# búsqueda, así que faltar aquí no rompe nada: degrada cada corrida en
# silencio, que es peor.
research = [
    "ddgs>=9.0",
]
# Sólo para las pocas páginas de tasas que renderizan por JavaScript (fase 9).
browser = [
    "playwright>=1.40",
]
mcp = [
    "mcp[cli]>=1.28,<2",
]
# Conjunto que instala la imagen Docker única: api + scheduler + cli.
# `llm` va dentro porque el job semanal de tasas corre en el scheduler y
# necesita extraer el texto de cada página; `ingest`, porque los jobs de la
# CNBV corren en el mismo servicio y leen XLSX y PDF; `research`, porque el
# job del nivel 3 también corre ahí y sin `ddgs` degradaría cada corrida.
app = [
    "centinela-financiero[api,scheduler,llm,ingest,research]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.0",
    # Alembic abre la conexión él mismo y no usa el driver async del runtime.
    "psycopg2-binary>=2.9",
    "hypothesis>=6.100",
    "ruff",
    "black",
    "mypy",
]

[project.urls]
Repository = "https://github.com/gibran-ojeda/brujula-financiera"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# El intermedio de GlobalSign que el portal de la CNBV no manda en su cadena
# TLS. Sin esto no llega a la imagen y la descarga falla en Linux con un error
# de certificado — ver `ingest_cnbv/downloader.py`.
ingest_cnbv = ["*.pem"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas. black sí las formatea (no cambia semántica), pero
# no se reescriben a mano sólo para acortar líneas: el DDL de un CHECK con
# quince valores de enum no cabe en 99 columnas y partirlo invitaría a
# introducir errores en SQL ya verificado contra la base.
"alembic/versions/*.py" = ["E501", "W291"]

[tool.ruff.lint.isort]
# Sin esto, el directorio local `alembic/` hace que ruff clasifique el paquete
# `alembic` (que es una dependencia) como código propio.
known-third-party = ["alembic"]

[tool.black]
target-version = ["py312"]
line-length = 99

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "requires_docker: necesita un daemon de Docker (testcontainers); se salta si no lo hay",
]

[tool.coverage.run]
source = ["src"]
branch = true
